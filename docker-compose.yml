# =====================================================================
# HR Management System - one-command local environment
#
# Usage:
#   1. (optional) cp .env.example .env   then edit GROQ_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost:8080
#      Login: admin@hr.sa / Admin@123
#
# EF Core migrations + seed data are applied automatically
# by the app itself on startup (see Program.cs / DbSeeder).
# =====================================================================

services:
  # ---------------- SQL Server 2022 ----------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hr-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Never commit a real password to .env in shared repos.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_password123}
    ports:
      # Optional: expose SQL Server to the host (e.g. for SSMS + debugging).
      # Comment out if the port is already in use.
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 requires -C to trust the self-signed certificate.
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
        -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------- ASP.NET Core MVC App ----------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Override connection string to point at the db service.
      ConnectionStrings__DefaultConnection: >-
        Server=db;Database=HRSystem;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:-Your_password123};
        TrustServerCertificate=True;MultipleActiveResultSets=true
      # Groq AI Assistant key (optional). Read from .env / shell.
      # Note: config keys use double underscore for nesting -> Groq:ApiKey.
      Groq__ApiKey: ${GROQ_API_KEY:-}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mssql_data:
